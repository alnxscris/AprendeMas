const SETTINGS_KEY = 'aprende-mas-settings';
const DEFAULT_SETTINGS = {
  dark: false,
  font: 'normal',
  contrast: false,
  notifs: { grades: true, messages: true, alerts: true }
};

function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return { ...DEFAULT_SETTINGS, ...parsed, notifs: { ...DEFAULT_SETTINGS.notifs, ...(parsed.notifs || {}) } };
    }
  } catch (e) {}
  return DEFAULT_SETTINGS;
}

/* =====================================================
   COMPONENTES PEQUEÑOS
   ===================================================== */
function SafeImg({ src, alt, className = '', fallback }) {
  const [cur, setCur] = useState(src);
  const [err, setErr] = useState(false);
  useEffect(() => { setCur(src); setErr(false); }, [src]);
  if (err) {
    return (
      <div className={`${className} bg-gradient-to-br from-indigo-100 to-emerald-100 dark:from-slate-700 dark:to-slate-600 flex items-center justify-center`}>
        <Icon name="camera" size={28} className="text-indigo-400" />
      </div>
    );
  }
  return <img src={cur} alt={alt} loading="lazy" onError={() => (fallback && cur !== fallback ? setCur(fallback) : setErr(true))} className={`${className} object-cover`} />;
}

function Face({ src, initials, cls }) {
  const [err, setErr] = useState(false);
  if (src && !err) return <img src={src} alt="" loading="lazy" onError={() => setErr(true)} className={`${cls} object-cover`} />;
  return <div className={cls}>{initials}</div>;
}

function Avatar({ initials, tone, size = 'w-12 h-12', text = 'text-base', online = false, photo }) {
  return (
    <div className={`relative flex-shrink-0 ${size}`}>
      <Face src={photo} initials={initials} cls={`${size} ${tone} ${text} rounded-full flex items-center justify-center font-bold`} />
      {online && (
        <span className="absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full bg-emerald-500 border-2 border-white dark:border-slate-800" aria-label="Activo" />
      )}
    </div>
  );
}

function Toggle({ checked, onChange, label }) {
  return (
    <button
      type="button"
      role="switch"
      aria-checked={checked}
      aria-label={label}
      onClick={() => onChange(!checked)}
      className={`relative inline-flex h-7 w-12 flex-shrink-0 items-center rounded-full transition-colors ${checked ? 'bg-indigo-600' : 'bg-slate-300 dark:bg-slate-600'}`}
    >
      <span className={`inline-block h-5 w-5 transform rounded-full bg-white shadow transition-transform ${checked ? 'translate-x-6' : 'translate-x-1'}`} />
    </button>
  );
}

function SettingRow({ icon, title, desc, children, tone = 'bg-indigo-50 text-indigo-600 dark:bg-indigo-900/40 dark:text-indigo-300' }) {
  return (
    <div className="flex items-center gap-3 py-3">
      <div className={`w-10 h-10 rounded-2xl flex items-center justify-center flex-shrink-0 ${tone}`}>
        <Icon name={icon} size={20} />
      </div>
      <div className="flex-1 min-w-0">
        <p className="text-sm font-semibold text-slate-800 dark:text-slate-100">{title}</p>
        {desc && <p className="text-xs text-slate-500 dark:text-slate-400">{desc}</p>}
      </div>
      {children}
    </div>
  );
}

function GradeBox({ grade, size = 'w-16 h-16', text = 'text-3xl' }) {
  return (
    <div className={`${size} ${text} flex-shrink-0 rounded-2xl bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 font-black flex items-center justify-center`}>
      {grade}
    </div>
  );
}

              onClick={() => onZoom(actPhoto(ev.title, ev.img))}
              className={`${CARD} snap-start flex-shrink-0 w-44 overflow-hidden text-left active:scale-[.98] transition`}
              aria-label={`Ver evidencia: ${ev.title}`}
            >
              <div className="relative">
                <SafeImg src={actPhoto(ev.title, ev.img)} fallback={ev.img} alt={ev.title} className="w-full h-28" />
                <span className="absolute top-2 left-2 text-[11px] font-bold bg-white/90 dark:bg-slate-900/90 text-indigo-700 dark:text-indigo-200 rounded-full px-2 py-0.5">{ev.date}</span>
              </div>
              <p className="p-3 text-sm font-semibold text-slate-800 dark:text-slate-100 leading-snug">{ev.title}</p>
            </button>
          ))}
        </div>
      </section>
    </div>
  );
}

/* =====================================================
   PESTAÑA 2: CHAT
   ===================================================== */
function MessageStatus({ status }) {
  if (status === 'sent') return <Icon name="check" size={14} className="text-indigo-200" />;
  if (status === 'delivered') return <Icon name="checkCheck" size={14} className="text-indigo-200" />;
  return <Icon name="checkCheck" size={14} className="text-sky-300" />;
}

function ChatList({ chats, onOpen }) {
  return (
    <div className="px-4 pt-5">
      <h1 className="text-2xl font-extrabold text-slate-900 dark:text-white">Chat con el profesor</h1>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">Comunicación directa con los docentes oficiales.</p>
      <div className="space-y-2.5">
        {chats.map((c) => {
          const last = [...c.messages].reverse().find((m) => m.text);
          return (
            <button key={c.id} onClick={() => onOpen(c.id)} className={`${CARD} w-full p-3.5 flex items-center gap-3 text-left active:scale-[.99] transition`}>
              <Avatar photo={TEACHER_PHOTO[c.id]} initials={c.initials} tone="bg-indigo-100 text-indigo-700 dark:bg-indigo-900/60 dark:text-indigo-200" online />
              <div className="flex-1 min-w-0">
                <div className="flex items-center justify-between gap-2">
                  <p className="text-sm font-bold text-slate-900 dark:text-white truncate">{c.teacher} - {c.subject}</p>
                  <span className="text-[11px] text-slate-400 flex-shrink-0">{last ? last.time : ''}</span>
                </div>
                <p className="text-[11px] text-indigo-600 dark:text-indigo-300 font-semibold">{c.context}</p>
                <div className="flex items-center justify-between gap-2 mt-0.5">
                  <p className="text-xs text-slate-500 dark:text-slate-400 truncate">
                    {last && last.from === 'me' ? 'Tú: ' : ''}{last ? last.text : ''}
                  </p>
                  {c.unread > 0 && (
                    <span className="min-w-[1.25rem] h-5 px-1.5 rounded-full bg-indigo-600 text-white text-[11px] font-bold flex items-center justify-center flex-shrink-0">{c.unread}</span>
                  )}
                </div>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function ChatRoom({ chat, onBack, onSend }) {
  const [text, setText] = useState('');
  const endRef = useRef(null);

  useEffect(() => {
    if (endRef.current) endRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }, [chat.messages.length, chat.typing]);

  const submit = (e) => {
    e.preventDefault();
    const t = text.trim();
    if (!t) return;
    onSend(chat.id, t);
    setText('');
  };

  return (
    <div className="fixed inset-0 z-40 flex justify-center bg-slate-200 dark:bg-slate-950">
      <div className="w-full max-w-md h-full flex flex-col bg-slate-50 dark:bg-slate-900 shadow-2xl slide-in">
        {/* Cabecera */}
        <div className="flex items-center gap-3 px-3 py-3 bg-white dark:bg-slate-800 border-b border-slate-100 dark:border-slate-700 ap-nav">
          <button onClick={onBack} aria-label="Volver a chats" className="w-10 h-10 rounded-full flex items-center justify-center text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">
            <Icon name="arrowLeft" size={20} />
          </button>
          <Avatar photo={TEACHER_PHOTO[chat.id]} initials={chat.initials} tone="bg-indigo-100 text-indigo-700 dark:bg-indigo-900/60 dark:text-indigo-200" size="w-10 h-10" text="text-sm" online />
          <div className="min-w-0 leading-tight">
            <p className="text-sm font-bold text-slate-900 dark:text-white truncate">{chat.teacher}</p>
            <p className="text-xs text-slate-500 dark:text-slate-400 truncate">
              {chat.typing ? <span className="text-emerald-600 dark:text-emerald-300 font-semibold">escribiendo…</span> : `${chat.subject} · ${chat.context}`}
            </p>
          </div>
          <span className="ml-auto inline-flex items-center gap-1 text-[10px] font-bold text-indigo-700 dark:text-indigo-200 bg-indigo-50 dark:bg-indigo-900/40 border border-indigo-100 dark:border-indigo-800 rounded-full px-2 py-1 flex-shrink-0">
            <Icon name="shield" size={12} /> Docente Oficial
          </span>
        </div>

        {/* Mensajes */}
        <div className="flex-1 overflow-y-auto px-3 py-4 space-y-2.5">
          {chat.messages.map((m) => {
            if (m.day) {
              return (
                <div key={m.id} className="flex justify-center py-1">
                  <span className="text-[11px] font-semibold text-slate-500 dark:text-slate-400 bg-slate-200/70 dark:bg-slate-800 rounded-full px-3 py-1">{m.day}</span>
                </div>
              );
            }
            const mine = m.from === 'me';
            return (
              <div key={m.id} className={`flex ${mine ? 'justify-end' : 'justify-start'} fade-up`}>
                <div
                  className={`max-w-[80%] rounded-3xl px-4 py-2.5 shadow-sm ${
                    mine
                      ? 'bg-indigo-600 text-white rounded-br-lg'
                      : 'bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-100 dark:border-slate-700 ap-box rounded-bl-lg'
                  }`}
                >
                  <p className="text-sm leading-relaxed break-words">{m.text}</p>
                  <div className={`mt-1 flex items-center gap-1 text-[10px] ${mine ? 'justify-end text-indigo-200' : 'text-slate-400'}`}>
                    <span>{m.time}</span>
                    {mine && <MessageStatus status={m.status} />}
                  </div>
                </div>
              </div>
            );
          })}
          {chat.typing && (
            <div className="flex justify-start">
              <div className="bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded-3xl rounded-bl-lg px-4 py-3 flex gap-1" aria-label="El docente está escribiendo">
                <span className="dot1 w-2 h-2 rounded-full bg-slate-400" />
                <span className="dot2 w-2 h-2 rounded-full bg-slate-400" />
                <span className="dot3 w-2 h-2 rounded-full bg-slate-400" />
              </div>
            </div>
          )}
          <div ref={endRef} />
        </div>

        {/* Input */}
        <form onSubmit={submit} className="flex items-center gap-2 px-3 py-3 bg-white dark:bg-slate-800 border-t border-slate-100 dark:border-slate-700 ap-nav">
          <input
            value={text}
            onChange={(e) => setText(e.target.value)}
            placeholder="Escribe un mensaje al docente…"
            aria-label="Mensaje"
            className="flex-1 rounded-full bg-slate-100 dark:bg-slate-900 border border-transparent focus:border-indigo-400 focus:outline-none px-4 py-3 text-base text-slate-800 dark:text-slate-100 placeholder-slate-400"
          />
          <button
            type="submit"
            aria-label="Enviar mensaje"
            disabled={!text.trim()}
            className="w-12 h-12 rounded-full bg-indigo-600 text-white flex items-center justify-center disabled:opacity-40 active:scale-95 transition flex-shrink-0"
          >
            <Icon name="send" size={20} />
          </button>
        </form>
      </div>
    </div>
  );
}

   PESTAÑA 3: ALERTAS
   ===================================================== */
function StudentSwitch({ idx, set }) {
  return (
    <div className="grid grid-cols-2 gap-2" role="tablist" aria-label="Seleccionar estudiante">
      {STUDENTS.map((st, i) => (
        <button key={st.id} role="tab" aria-selected={i === idx} onClick={() => set(i)}
          className={`rounded-2xl p-2 flex items-center gap-2 text-left border transition ${i === idx ? 'bg-indigo-600 border-indigo-600 text-white shadow-md' : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 ap-card'}`}>
          <Face src={STUDENT_PHOTO[st.id]} initials={st.initials} cls={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 ${i === idx ? 'bg-white/20 text-white' : st.tone}`} />
          <p className="text-sm font-bold truncate">{st.name.split(' ')[0]}</p>
        </button>
      ))}
    </div>

}

function Segments({ items, value, onChange }) {
  return (
    <div className="grid gap-1 rounded-2xl bg-slate-200/70 dark:bg-slate-800 p-1" style={{ gridTemplateColumns: `repeat(${items.length}, minmax(0, 1fr))` }}>
      {items.map((it) => (
        <button key={it.id} onClick={() => onChange(it.id)}
          className={`relative rounded-xl py-2.5 text-xs font-bold transition ${value === it.id ? 'bg-white dark:bg-slate-700 text-indigo-700 dark:text-indigo-200 shadow-sm' : 'text-slate-500 dark:text-slate-400'}`}>
          {it.label}
          {it.n > 0 && <span className="ml-1 inline-flex min-w-[1.1rem] h-[1.1rem] px-1 rounded-full bg-amber-500 text-white text-[10px] items-center justify-center align-middle">{it.n}</span>}
        </button>
      ))}
    </div>
  );
}

function Chips({ items, value, onChange }) {
  return (
    <div className="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4">
      {items.map((f) => (
        <button key={f.id} onClick={() => onChange(f.id)}
          className={`flex-shrink-0 rounded-full px-4 py-2 text-xs font-bold border transition ${value === f.id ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'}`}>{f.label}</button>
      ))}
    </div>
  );
}

/* ---------- ACTIVIDADES (día a día + evidencias) ---------- */
function Activity({ studentIdx, setStudentIdx, onZoom }) {
  const s = STUDENTS[studentIdx];
  const ex = EXTRA[s.id];
  const [seg, setSeg] = useState('feed');
  const [area, setArea] = useState('Todas');
  useEffect(() => { setArea('Todas'); }, [studentIdx]);
  const list = ex.activities.filter((a) => area === 'Todas' || a.area === area);
  const today = ex.activities.filter((a) => a.date === TODAY);
  const todayAreas = [...new Set(today.map((a) => a.area))].join(', ');
  const groups = [];
  list.forEach((a) => {
    const g = groups.find((x) => x.date === a.date);
    if (g) g.items.push(a); else groups.push({ date: a.date, items: [a] });
  });
  return (
    <div className="px-4 pt-5 space-y-4">
      <div>
        <h1 className="text-2xl font-extrabold text-slate-900 dark:text-white">Actividades</h1>
        <p className="text-sm text-slate-500 dark:text-slate-400">Lo que {s.name.split(' ')[0]} hizo en el colegio, día a día.</p>
      </div>
      <StudentSwitch idx={studentIdx} set={setStudentIdx} />
      <section key={s.id + 'jor'} className="rounded-3xl bg-indigo-50 dark:bg-indigo-900/30 border border-indigo-100 dark:border-indigo-800 ap-box p-4 flex items-center gap-3 fade-up">
        <div className="w-11 h-11 rounded-2xl bg-indigo-600 text-white flex items-center justify-center flex-shrink-0"><Icon name="clipboard" size={22} /></div>
        <div className="leading-tight">
          <p className="text-[10px] font-bold tracking-widest text-indigo-500 dark:text-indigo-300">RESUMEN DE LA JORNADA</p>
          <p className="text-sm font-bold text-indigo-800 dark:text-indigo-100">Hoy realizó {today.length} {today.length === 1 ? 'actividad' : 'actividades'}</p>
          <p className="text-xs text-indigo-700 dark:text-indigo-200">{todayAreas}</p>
        </div>
      </section>
      <Segments items={[{ id: 'feed', label: 'Actividades' }, { id: 'evid', label: 'Evidencias' }]} value={seg} onChange={setSeg} />
      <Chips items={['Todas', ...ex.areas.map((a) => a.name)].map((n) => ({ id: n, label: n }))} value={area} onChange={setArea} />

      {seg === 'feed' && groups.map((g) => (
        <div key={g.date}>
          <p className="text-[11px] font-bold tracking-widest text-slate-400 mb-2 uppercase">{g.date === TODAY ? 'Hoy · ' + g.date : g.date}</p>
          <div className="space-y-2.5">
            {g.items.map((a) => (
              <article key={a.id} className={`${CARD} p-3 flex gap-3 fade-up`}>
                <button onClick={() => onZoom(a.img)} aria-label={`Ver evidencia: ${a.title}`} className="flex-shrink-0 active:scale-95 transition">
                  <SafeImg src={a.img} alt={a.title} className="w-20 h-20 rounded-2xl" />
                </button>
                <div className="min-w-0">
                  <p className="text-[11px] font-bold text-indigo-600 dark:text-indigo-300">{a.area}</p>
                  <p className="text-sm font-bold text-slate-900 dark:text-white leading-snug">{a.title}</p>
                  <p className="text-xs text-slate-600 dark:text-slate-300 mt-0.5">{a.desc}</p>
                  <div className="mt-1.5 flex flex-wrap gap-1.5">
                    <span className="text-[10px] font-bold text-slate-500 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 rounded-full px-2 py-0.5">{a.type}</span>
                    {a.logro && <span className="text-[10px] font-bold text-emerald-700 dark:text-emerald-300 bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-200 dark:border-emerald-800 rounded-full px-2 py-0.5">Logro destacado</span>}
                  </div>
                </div>
              </article>
            ))}
          </div>
        </div>
      ))}

      {seg === 'evid' && (
        <div className="grid grid-cols-2 gap-3">
          {list.map((a) => (
            <button key={a.id} onClick={() => onZoom(a.img)} className={`${CARD} overflow-hidden text-left active:scale-[.98] transition`} aria-label={`Ver evidencia: ${a.title}`}>
              <div className="relative">
                <SafeImg src={a.img} alt={a.title} className="w-full h-28" />
                <span className="absolute top-2 left-2 text-[11px] font-bold bg-white/90 dark:bg-slate-900/90 text-indigo-700 dark:text-indigo-200 rounded-full px-2 py-0.5">{a.date}</span>
              </div>
              <div className="p-2.5">
                <p className="text-[11px] font-bold text-indigo-600 dark:text-indigo-300">{a.area}</p>
                <p className="text-sm font-semibold text-slate-800 dark:text-slate-100 leading-snug">{a.title}</p>
              </div>
            </button>
          ))}
        </div>
      )}
      {list.length === 0 && <div className={`${CARD} p-6 text-center text-sm text-slate-500`}>No hay actividades en esta área.</div>}
    </div>
  );
}

/* ---------- PROGRESO + RECOMENDACIONES PARA CASA ---------- */
function ProgressBlock({ s }) {
  const ex = EXTRA[s.id];
  const first = s.name.split(' ')[0];
  const ref = ex.areas.filter((a) => statusOf(a.pct) === 'refuerzo');
  const good = ex.areas.filter((a) => statusOf(a.pct) === 'buen');
  return (

function Alerts({ alerts, setAlerts, onGo }) {
  const [filter, setFilter] = useState('todas');
  const filters = [{ id: 'todas', label: 'Todas' }, ...Object.entries(TYPE_STYLES).map(([id, v]) => ({ id, label: v.label }))];
  const shown = alerts.filter((a) => filter === 'todas' || a.type === filter);
  const unread = alerts.filter((a) => !a.read).length;

  const markRead = (id) => setAlerts((prev) => prev.map((a) => (a.id === id ? { ...a, read: true } : a)));
  const markAll = () => setAlerts((prev) => prev.map((a) => ({ ...a, read: true })));

  const groups = [];
  shown.forEach((a) => {
    const g = groups.find((x) => x.when === a.when);
    if (g) g.items.push(a);
    else groups.push({ when: a.when, items: [a] });
  });

  groups.forEach((g) => g.items.sort((x, y) => TYPE_STYLES[x.type].pr - TYPE_STYLES[y.type].pr));
  const nameOf = (id) => (id === 'ambos' ? 'Ambos hijos' : STUDENTS.find((s) => s.id === id).name.split(' ')[0]);

  return (
    <div className="px-4 pt-5">
      <div className="flex items-start justify-between gap-2">
        <div>
          <h1 className="text-2xl font-extrabold text-slate-900 dark:text-white">Notificaciones</h1>
          <p className="text-sm text-slate-500 dark:text-slate-400">Lo importante primero: dificultades, recomendaciones y avances.</p>
        </div>
        {unread > 0 && (
          <button onClick={markAll} className="text-xs font-bold text-indigo-600 dark:text-indigo-300 bg-indigo-50 dark:bg-indigo-900/40 rounded-full px-3 py-2 flex-shrink-0">
            Marcar todo leído
          </button>
        )}
      </div>

      <div className="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4 py-4">
        {filters.map((f) => (
          <button
            key={f.id}
            onClick={() => setFilter(f.id)}
            className={`flex-shrink-0 rounded-full px-4 py-2 text-xs font-bold border transition ${
              filter === f.id
                ? 'bg-indigo-600 text-white border-indigo-600'
                : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'
            }`}
          >
            {f.label}
          </button>
        ))}
      </div>

      {groups.length === 0 && (
        <div className={`${CARD} p-8 text-center`}>
          <Icon name="inbox" size={32} className="mx-auto text-slate-400 mb-2" />
          <p className="text-sm text-slate-500 dark:text-slate-400">No hay avisos en esta categoría.</p>
        </div>
      )}

      <div className="space-y-5">
        {groups.map((g) => (
          <div key={g.when}>
            <p className="text-[11px] font-bold tracking-widest text-slate-400 mb-2 uppercase">{g.when}</p>
            <div className="space-y-2.5">
              {g.items.map((a) => {
                const st = TYPE_STYLES[a.type];
                return (
                  <button
                    key={a.id}
                    onClick={() => { markRead(a.id); if (a.to) onGo(a.to, a.student); }}
                    className={`${CARD} w-full p-3.5 flex items-start gap-3 text-left active:scale-[.99] transition ${a.read ? 'opacity-80' : ''} ${a.type === 'dificultad' && !a.read ? 'ring-2 ring-amber-300 dark:ring-amber-700' : ''}`}
                  >
                    <div className={`w-11 h-11 rounded-2xl border flex items-center justify-center flex-shrink-0 ${st.box}`}>
                      <Icon name={st.icon} size={20} />
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-start justify-between gap-2">
                        <p className="text-sm font-bold text-slate-900 dark:text-white leading-snug">{a.title}</p>
                        {!a.read && <span className="w-2.5 h-2.5 rounded-full bg-indigo-600 flex-shrink-0 mt-1" aria-label="Sin leer" />}
                      </div>
                      <p className="text-xs text-slate-600 dark:text-slate-300 mt-0.5">{a.text}</p>
                      <div className="mt-2 flex items-center gap-2">
                        <span className="text-[10px] font-bold text-slate-500 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 rounded-full px-2 py-0.5">{st.label}</span>
                        <span className="text-[10px] font-semibold text-indigo-600 dark:text-indigo-300">{nameOf(a.student)}</span>
                        {a.to && <span className="ml-auto text-[11px] font-bold text-indigo-600 dark:text-indigo-300">Ver →</span>}
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState('home');
  const [studentIdx, setStudentIdx] = useState(0);
  const [detailOpen, setDetailOpen] = useState(false);
  const [confirmed, setConfirmed] = useState({ mateo: null, sofia: null });
  const [zoomSrc, setZoomSrc] = useState(null);
  const [chats, setChats] = useState(INITIAL_CHATS);
  const [activeChat, setActiveChat] = useState(null);
  const [alerts, setAlerts] = useState(INITIAL_ALERTS);
  const [comms, setComms] = useState(INITIAL_COMMS);
  const [noticeSeg, setNoticeSeg] = useState('notif');
  const [settings, setSettings] = useState(loadSettings);
  const activeChatRef = useRef(null);

  const student = STUDENTS[studentIdx];

  // Aplicar ajustes: modo oscuro, tamaño de fuente y alto contraste
  useEffect(() => {
    const root = document.documentElement;
    root.classList.toggle('dark', settings.dark);
    root.classList.toggle('hc', settings.contrast);
    root.style.fontSize = FONT_SIZES[settings.font] || '16px';
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
  }, [settings]);

  // Volver arriba al cambiar de pestaña
  useEffect(() => { window.scrollTo(0, 0); }, [tab]);

  // Bloquear scroll del fondo con modales abiertos
  useEffect(() => {
    document.body.style.overflow = detailOpen || activeChat || zoomSrc ? 'hidden' : '';
  }, [detailOpen, activeChat, zoomSrc]);

  const openChat = (id) => {
    activeChatRef.current = id;
    setActiveChat(id);
    setChats((prev) => prev.map((c) => (c.id === id ? { ...c, unread: 0 } : c)));
  };
  const closeChat = () => {
    activeChatRef.current = null;
    setActiveChat(null);
  };

  const updateMsgStatus = (chatId, msgId, status) =>
    setChats((prev) =>
      prev.map((c) =>
        c.id === chatId ? { ...c, messages: c.messages.map((m) => (m.id === msgId ? { ...m, status } : m)) } : c
      )
    );

  const sendMessage = (chatId, text) => {
    const id = Date.now();
    const msg = { id, from: 'me', text, time: nowTime(), status: 'sent' };
    setChats((prev) => prev.map((c) => (c.id === chatId ? { ...c, messages: [...c.messages, msg] } : c)));

    setTimeout(() => updateMsgStatus(chatId, id, 'delivered'), 700);
    setTimeout(() => {
      updateMsgStatus(chatId, id, 'read');
      setChats((prev) => prev.map((c) => (c.id === chatId ? { ...c, typing: true } : c)));
    }, 1800);
    setTimeout(() => {
      const reply = {
        id: id + 1,
        from: 'teacher',
        text: TEACHER_REPLIES[Math.floor(Math.random() * TEACHER_REPLIES.length)],
        time: nowTime()
      };
      setChats((prev) =>
        prev.map((c) =>
          c.id === chatId
            ? {
                ...c,
                typing: false,
                messages: [...c.messages, reply],
                unread: activeChatRef.current === chatId ? 0 : c.unread + 1
              }
            : c
        )
      );
    }, 3800);
  };

  const confirmGrade = () => {
    const t = nowTime();
    setConfirmed((p) => ({ ...p, [student.id]: t }));
    setAlerts((prev) => [
      {
        id: Date.now(),
        type: 'avance',
        student: student.id,
        title: 'Acuse de recibo enviado',
        text: `Confirmaste la calificación ${student.last.grade} de ${student.last.subject}.`,
        when: 'Hoy',
        read: true
      },
      ...prev
    ]);
  };

  const go = (to, sid) => {
    const i = STUDENTS.findIndex((x) => x.id === sid);
    if (i >= 0) setStudentIdx(i);
    let [t, anchor] = to.split('#');
    if (t === 'progress') { t = 'home'; anchor = anchor || 'progress'; }
    if (t === 'comms' || t === 'notif') { setNoticeSeg(t); setTab('alerts'); } else setTab(t);
    if (anchor) setTimeout(() => { const el = document.getElementById(anchor); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 150);
  };
  const unreadComms = comms.filter((c) => !c.confirmed).length;
  const unreadAlerts = alerts.filter((a) => !a.read).length;
  const unreadChats = chats.reduce((n, c) => n + c.unread, 0);
  const currentChat = chats.find((c) => c.id === activeChat);

  return (
    <div className="max-w-md w-full min-h-screen shadow-2xl relative mx-auto bg-slate-50 dark:bg-slate-900 overflow-hidden font-sans pb-20 text-slate-800 dark:text-slate-100">
      {tab === 'home' && (
        <Home
          studentIdx={studentIdx}
          setStudentIdx={setStudentIdx}
          confirmedAt={confirmed[student.id]}
          onOpenDetail={() => setDetailOpen(true)}
          onZoom={setZoomSrc}
          onGoAlerts={() => go('notif')}
          onGo={go}
          unreadAlerts={unreadAlerts}
        />
      )}
      {tab === 'activity' && <Activity studentIdx={studentIdx} setStudentIdx={setStudentIdx} onZoom={setZoomSrc} />}
      {tab === 'chat' && <ChatList chats={chats} onOpen={openChat} />}
      {tab === 'alerts' && <Notices seg={noticeSeg} setSeg={setNoticeSeg} alerts={alerts} setAlerts={setAlerts} comms={comms} setComms={setComms} onGo={go} />}
      {tab === 'profile' && <Profile settings={settings} setSettings={setSettings} />}

      <BottomNav tab={tab} setTab={setTab} chatBadge={unreadChats} alertBadge={unreadAlerts + unreadComms} />

      {detailOpen && (
        <EvaluationDetail
          student={student}
          confirmedAt={confirmed[student.id]}
          onConfirm={confirmGrade}
          onClose={() => setDetailOpen(false)}
          onZoom={setZoomSrc}
        />
      )}

      {currentChat && <ChatRoom chat={currentChat} onBack={closeChat} onSend={sendMessage} />}

      {zoomSrc && <Lightbox src={zoomSrc} onClose={() => setZoomSrc(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
